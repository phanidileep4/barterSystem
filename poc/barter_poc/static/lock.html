<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarterSystem POC</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="lock">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="16" cy="5" r="4" class="m1"/><circle cx="25.5" cy="21.5" r="4" class="m2"/><circle cx="6.5" cy="21.5" r="4" class="m3"/>
    </svg>
    <h1>BarterSystem</h1>
    <p>A private preview of a proof of concept. Enter the passcode you were given.</p>
    <form class="card add" method="post" action="/unlock">
      <label class="field"><span>Passcode</span>
        <input type="password" name="passcode" required autofocus autocomplete="current-password"></label>
      <!--error-->
      <button class="primary" type="submit">Enter</button>
    </form>
  </main>
</body>
</html>
