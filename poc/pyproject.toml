[project]
name = "barter-poc"
version = "0.1.0"
description = "BarterSystem proof of concept: one community, explained circles, all-or-nothing agreement"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "barter-engine",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Claude-assisted understanding. Without it (or without credentials) the
# engine's dictionary is used.
claude = ["anthropic>=0.70"]

[project.scripts]
barter-poc = "barter_poc.api:main"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8",
]

[tool.uv.sources]
barter-engine = { path = "../prototype", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barter_poc"]
