[project]
name = "barter-engine"
version = "0.1.0"
description = "Explainable exchange-circle matching for BarterSystem (standard library only)"
requires-python = ">=3.9"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barter"]
